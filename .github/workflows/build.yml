name: Build Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Cần quyền ghi để tạo/đính file vào GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build

      # electron-builder tự publish lên GitHub Release: .exe + latest.yml + .blockmap
      # (latest.yml là metadata để app cũ biết có bản mới -> auto-update).
      - name: Build & publish .exe (kèm metadata auto-update)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: banner-ai-windows
          path: |
            release/*.exe
            release/latest.yml
